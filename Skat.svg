    <path d="M50 63.5 C46.5 68 39.2 72.4 39.2 78 C39.2 81 41.6 83 44.4 83 C46.6 83 48.3 81.9 49.2 80.4 L48.4 84 L46.6 87.3 L53.4 87.3 L51.6 84 L50.8 80.4 C51.7 81.9 53.4 83 55.6 83 C58.4 83 60.8 81 60.8 78 C60.8 72.4 53.5 68 50 63.5 Z"/>
